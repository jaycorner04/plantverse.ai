name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Create public app environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          BACKEND_BASE_URL=https://dj2i5my9uyve1.cloudfront.net
          GEMINI_API_KEY=
          GEMINI_MODEL=gemini-2.5-flash-lite
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.4 \
            --build-number=5 \
            --dart-define=BACKEND_BASE_URL=https://dj2i5my9uyve1.cloudfront.net \
            --dart-define=APP_VERSION_NAME=1.0.4 \
            --dart-define=APP_VERSION_CODE=5

      - name: Stage APK
        run: |
          mkdir -p mobile-apk
          cp build/app/outputs/flutter-apk/app-release.apk mobile-apk/PlantVerse-AI-release.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-apk-latest --yes --cleanup-tag || true
          gh release create mobile-apk-latest mobile-apk/PlantVerse-AI-release.apk \
            --title "PlantVerse AI Mobile APK" \
            --notes "Latest Android APK built from $GITHUB_SHA. Backend: https://dj2i5my9uyve1.cloudfront.net"
